<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 — Página não encontrada | Hugo G. Silva</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230c100e'/><text x='16' y='23' font-family='Arial,sans-serif' font-size='22' font-weight='bold' text-anchor='middle' fill='%234ade80'>H</text></svg>">
    <style>
        :root { color-scheme: dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            text-align: center;
            padding: 24px;
            background: #0c100e;
            color: #eaf0ec;
            font-family: "Space Grotesk", system-ui, sans-serif;
        }
        .code {
            font-size: clamp(4rem, 18vw, 9rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(120deg, #4ade80, #16a34a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: clamp(1.2rem, 4vw, 1.6rem); font-weight: 600; }
        p { color: #aab6b0; max-width: 420px; }
        a {
            margin-top: 8px;
            display: inline-block;
            padding: 12px 24px;
            border-radius: 10px;
            background: #22c55e;
            color: #04140b;
            font-weight: 600;
            text-decoration: none;
            transition: transform .2s, background .2s;
        }
        a:hover { background: #4ade80; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou acessar não existe ou foi movido.</p>
    <a href="/">Voltar ao início</a>
</body>
</html>
